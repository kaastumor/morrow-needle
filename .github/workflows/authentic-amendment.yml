name: Authentic amendment regression + live probe
# Passive historical/research workflow. Manual dispatch only under #290.

on:
  workflow_dispatch:


concurrency:
  group: authentic-amendment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run deterministic authentic-instruction regressions
        run: python -m pytest -q tests/test_authentic_amendment_instructions.py

  live-probe:
    # The live official-source check remains valuable integration evidence, but
    # endpoint availability is not a deterministic branch-CI contract.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Verify live authentic Article 3 replacement
        run: python scripts/probe_authentic_amendment.py
      - name: Upload authentic amendment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authentic-amendment-evidence
          path: artifacts/authentic-amendment
          if-no-files-found: error
