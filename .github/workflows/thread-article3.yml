name: Thread Article 3 2025 contract

on:
  push:
    paths:
      - "scripts/probe_thread_article3_2004.py"
      - "scripts/probe_thread_article3_2025.py"
      - "scripts/probe_thread_article3_corrigendum.py"
      - "scripts/build_article3_thread_provenance.py"
      - "src/needle/ast/**"
      - "src/needle/mutation/**"
      - "src/needle/thread/**"
      - "scripts/build_thread_article3_preview.py"
      - "tests/test_thread_gold.py"
      - "tests/test_thread_render.py"
      - "fixtures/gold/reg794-article3-thread-v0.1.json"
      - "schemas/thread-v0.1.schema.json"
      - "fixtures/thread/**"
      - "tests/test_thread_article3.py"
      - ".github/workflows/thread-article3.yml"
      - "pyproject.toml"
  workflow_dispatch:

concurrency:
  group: thread-article3-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-2025:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run Thread unit tests
        run: |
          python -m pytest -q \
            tests/test_thread_article3.py \
            tests/test_thread_gold.py \
            tests/test_thread_render.py
      - name: Build Thread provenance closure candidate
        run: python scripts/build_article3_thread_provenance.py
      - name: Build public Thread preview
        run: python scripts/build_thread_article3_preview.py
      - name: Verify Article 3 2004 baseline from live official sources
        run: python scripts/probe_thread_article3_2004.py
      - name: Verify Article 3 2025 transition from live official sources
        run: python scripts/probe_thread_article3_2025.py
      - name: Observe related corrigendum source availability
        run: python scripts/probe_thread_article3_corrigendum.py
      - name: Upload Thread evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thread-article3-2025-evidence
          path: |
            artifacts/thread-2004
            artifacts/thread-2025
            artifacts/thread-corrigendum
            artifacts/thread-provenance
            artifacts/thread-preview
          if-no-files-found: error
