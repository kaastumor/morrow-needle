name: Source Anomaly derived view
# Passive historical/research workflow. Manual dispatch only under #290.

on:
  workflow_dispatch:


jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e ".[test]"
      - name: Test Source Anomaly contract
        run: python -m pytest -q tests/test_source_anomaly_view.py
      - name: Build Source Anomaly preview
        run: python scripts/build_source_anomaly_view.py
      - uses: actions/upload-artifact@v4
        with:
          name: source-anomaly-first-cohort
          path: artifacts/source-anomaly/
