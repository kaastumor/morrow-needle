name: Live Cellar ingestion feed contract

on:
  push:
    paths:
      - "schemas/cellar-ingestion-event-v0.1.schema.json"
      - "src/needle/updates/**"
      - "scripts/probe_cellar_feed.py"
      - "tests/test_cellar_updates.py"
      - ".github/workflows/cellar-feed.yml"
      - "pyproject.toml"
  workflow_dispatch:

concurrency:
  group: live-cellar-feed-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"

      - name: Run update-detector tests
        run: python -m pytest -q tests/test_cellar_updates.py

      - name: Verify historical notification through live RSS and Atom
        run: python scripts/probe_cellar_feed.py

      - name: Upload live feed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cellar-feed-evidence
          path: artifacts/cellar-feed
          if-no-files-found: error
