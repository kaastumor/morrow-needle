name: Operational Needle monitor — frozen pilot

# Issue #84 retired the scheduled Git-backed monitor after the public-product
# horizon was stopped. The checked-in state remains historical evidence and a
# regression input. A live cycle is now an explicit diagnostic action and never
# promotes generated state back to main.
on:
  workflow_dispatch:
    inputs:
      run_live_cycle:
        description: "Run one live feed cycle from the frozen pilot cursor (diagnostic only)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: operational-needle-frozen-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e ".[test]"
      - name: Test operational state and routing
        run: |
          python -m pytest -q \
            tests/test_operational_state.py \
            tests/test_operational_concurrency.py \
            tests/test_operational_feed.py \
            tests/test_operational_reobserve.py \
            tests/test_operational_temporal_metadata.py \
            tests/test_operational_legal_analysis.py
      - name: Process one live feed window
        if: ${{ inputs.run_live_cycle }}
        run: python scripts/run_operational_monitor_once.py
      - name: Upload diagnostic cycle
        if: ${{ inputs.run_live_cycle }}
        uses: actions/upload-artifact@v4
        with:
          name: operational-monitor-diagnostic
          path: artifacts/operational-cycle/
          if-no-files-found: error
