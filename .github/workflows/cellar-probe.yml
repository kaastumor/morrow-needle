name: Cellar source probe

on:
  push:
    paths:
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "schemas/**"
      - "pyproject.toml"
      - ".github/workflows/cellar-probe.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"

      - name: Run source-adapter unit tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Probe modern and historical CELEX works
        run: |
          python scripts/probe_cellar.py \
            32004R0794 \
            31958R0001 \
            02004R0794-20250813 \
            --out artifacts/cellar-probe.json

      - name: Build live canonical AST fixtures
        run: python scripts/build_live_ast_fixtures.py --out artifacts/live-ast

      - name: Upload live AST evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-ast-fixtures
          path: artifacts/live-ast
          if-no-files-found: error

      - name: Upload raw probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cellar-source-probe
          path: artifacts/cellar-probe.json
          if-no-files-found: error
