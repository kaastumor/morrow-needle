name: Live authentic amendment contract

on:
  push:
    paths:
      - "src/needle/mutation/instructions.py"
      - "src/needle/mutation/reconcile.py"
      - "scripts/probe_authentic_amendment.py"
      - "tests/test_authentic_amendment_instructions.py"
      - ".github/workflows/authentic-amendment.yml"
      - "pyproject.toml"
  workflow_dispatch:

concurrency:
  group: live-authentic-amendment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"

      - name: Run authentic-instruction unit tests
        run: python -m pytest -q tests/test_authentic_amendment_instructions.py

      - name: Verify live authentic Article 3 replacement
        run: python scripts/probe_authentic_amendment.py

      - name: Upload authentic amendment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authentic-amendment-evidence
          path: artifacts/authentic-amendment
          if-no-files-found: error
