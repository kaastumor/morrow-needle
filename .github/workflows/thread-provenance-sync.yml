name: Sync Article 3 Thread provenance

on:
  push:
    paths:
      - ".github/workflows/thread-provenance-sync.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e ".[test]"
      - name: Generate validated ledger
        run: |
          python scripts/build_article3_thread_provenance.py \
            --out artifacts/generated-reg794-article3-dag-v0.1.json
      - name: Promote generated ledger if changed
        run: |
          if cmp -s \
            artifacts/generated-reg794-article3-dag-v0.1.json \
            fixtures/provenance/reg794-article3-dag-v0.1.json; then
            echo "Canonical ledger already matches generated closure."
            exit 0
          fi
          cp artifacts/generated-reg794-article3-dag-v0.1.json \
            fixtures/provenance/reg794-article3-dag-v0.1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fixtures/provenance/reg794-article3-dag-v0.1.json
          git commit -m "Close Article 3 Thread provenance"
          git push
