name: Recent legislation update discovery

on:
  push:
    paths:
      - "scripts/discover_recent_legislation_updates.py"
      - ".github/workflows/recent-legislation-update-discovery.yml"
  workflow_dispatch:

concurrency:
  group: recent-legislation-update-discovery-main
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e ".[test]"
      - name: Discover amendment-like legislation updates
        run: python scripts/discover_recent_legislation_updates.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recent-legislation-update-discovery
          path: artifacts/recent-legislation-update-discovery/
          if-no-files-found: error
