name: Operational Needle monitor

on:
  push:
    paths:
      - "scripts/run_operational_monitor_once.py"
      - "src/needle/operations/**"
      - "src/needle/updates/reobserve.py"
      - "src/needle/updates/relevance.py"
      - "schemas/operational-state-v0.1.schema.json"
      - "schemas/operational-result-v0.1.schema.json"
      - "schemas/feed-card-v0.1.schema.json"
      - "tests/test_operational_state.py"
      - "tests/test_operational_feed.py"
      - "tests/test_operational_reobserve.py"
      - ".github/workflows/operational-monitor.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: operational-needle-monitor-main
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Start from latest completed operational state
        run: |
          # A push-triggered run may wait behind another monitor cycle. Its
          # event SHA can therefore predate state committed by the run ahead
          # of it. Never process from that stale checkout: operational cursor
          # and baselines are monotonic state.
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e ".[test]"
      - name: Test operational state and routing
        run: |
          python -m pytest -q \
            tests/test_operational_state.py \
            tests/test_operational_feed.py \
            tests/test_operational_reobserve.py
      - name: Process one complete feed window
        run: python scripts/run_operational_monitor_once.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operational-monitor-cycle
          path: artifacts/operational-cycle/
          if-no-files-found: warn
      - name: Promote completed operational state
        run: |
          git fetch origin main
          set +e
          python - <<'PY'
          import json, subprocess, sys
          generated=json.load(open('artifacts/operational-cycle/state.json'))
          report=json.load(open('artifacts/operational-cycle/report.json'))
          remote=json.loads(subprocess.check_output([
              'git','show','origin/main:data/operational-pilot-state-v0.1.json'
          ]))
          remote_cursor=remote['poll_cursor']['last_completed_end']
          expected=report['window']['previous_completed_end']
          generated_cursor=generated['poll_cursor']['last_completed_end']
          if remote_cursor == generated_cursor:
              print('Operational cycle already promoted by another run.')
              sys.exit(20)
          if remote_cursor != expected:
              print(
                  'Stale operational cycle; remote cursor moved from ',
                  expected,' to ',remote_cursor,'. Skipping promotion.',
                  sep=''
              )
              sys.exit(20)
          PY
          rc=$?
          set -e
          if [ "$rc" -eq 20 ]; then
            exit 0
          fi
          if [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi
          git reset --hard origin/main
          cp artifacts/operational-cycle/state.json data/operational-pilot-state-v0.1.json
          cp artifacts/operational-cycle/cards.json data/operational-pilot-latest-cards.json
          cp artifacts/operational-cycle/report.json data/operational-pilot-last-report.json
          if git diff --quiet -- data/operational-pilot-state-v0.1.json data/operational-pilot-latest-cards.json data/operational-pilot-last-report.json; then
            echo "No operational state change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/operational-pilot-state-v0.1.json data/operational-pilot-latest-cards.json data/operational-pilot-last-report.json
          git commit -m "Advance operational Needle pilot state"
          git push origin HEAD:main
