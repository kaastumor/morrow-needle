name: Promote Article 3 lifecycle provenance

on:
  push:
    paths:
      - ".github/workflows/promote-article3-lifecycle-provenance.yml"

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e ".[test]"
      - name: Generate validated ledger
        run: |
          python scripts/build_article3_thread_provenance.py \
            --out artifacts/generated-ledger.json
      - name: Promote if changed
        run: |
          if cmp -s artifacts/generated-ledger.json fixtures/provenance/reg794-article3-dag-v0.1.json; then
            echo "Ledger already current."
            exit 0
          fi
          cp artifacts/generated-ledger.json fixtures/provenance/reg794-article3-dag-v0.1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fixtures/provenance/reg794-article3-dag-v0.1.json
          git commit -m "Close Article 3 channel lifecycle provenance"
          git push
