name: Legal AST contract + manual live fixture probe
# Passive historical/research workflow. Manual dispatch only under #290.

on:
  workflow_dispatch:


concurrency:
  group: live-legal-ast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"

      - name: Run AST parser unit tests
        run: |
          python -m pytest -q \
            tests/test_legal_ast_parsers.py \
            tests/test_ast_completeness.py \
            tests/test_formex_modifications.py

      - name: Build and benchmark live official AST fixtures
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/build_live_ast_fixtures.py --out artifacts/live-ast

      - name: Upload live AST evidence
        if: github.event_name == 'workflow_dispatch' && always()
        uses: actions/upload-artifact@v4
        with:
          name: live-ast-fixtures
          path: artifacts/live-ast
          if-no-files-found: error
