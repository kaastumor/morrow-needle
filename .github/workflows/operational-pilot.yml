name: Operational Needle vertical slice
# Passive historical/research workflow. Manual dispatch only under #290.

on:
  workflow_dispatch:


concurrency:
  group: operational-needle-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e ".[test]"
      - name: Test operational contracts
        run: |
          python -m pytest -q \
            tests/test_operational_feed.py \
            tests/test_operational_reobserve.py
      - name: Sample heterogeneous live Cellar events
        run: python scripts/probe_operational_feed_sample.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operational-cold-start-sample
          path: artifacts/operational-pilot/
          if-no-files-found: error
