name: Cellar ingestion feed regression + live probe

on:
  push:
    paths:
      - "schemas/cellar-ingestion-event-v0.1.schema.json"
      - "src/needle/updates/**"
      - "scripts/probe_cellar_feed.py"
      - "tests/test_cellar_updates.py"
      - ".github/workflows/cellar-feed.yml"
      - "pyproject.toml"
  workflow_dispatch:

concurrency:
  group: cellar-feed-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"

      - name: Run deterministic update-detector regressions
        run: python -m pytest -q tests/test_cellar_updates.py

  live-probe:
    # External endpoint availability/drift is integration evidence, not a
    # deterministic CI contract. Keep the probe manually runnable and preserve
    # its artifact without making ordinary branch-green depend on the network.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Verify replayable notification through live RSS and Atom
        run: python scripts/probe_cellar_feed.py
      - name: Upload live feed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cellar-feed-evidence
          path: artifacts/cellar-feed
          if-no-files-found: error
