name: Money corrigendum audit probe

on:
  push:
    paths:
      - "scripts/probe_reg2742_money_corrigendum.py"
      - ".github/workflows/money-corrigendum-audit.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e ".[test]"
      - name: Inspect official Cellar corrigendum
        run: python scripts/probe_reg2742_money_corrigendum.py
      - uses: actions/upload-artifact@v4
        with:
          name: reg2742-money-corrigendum-inspection
          path: artifacts/audit/reg2742-money-corrigendum-inspection.json
