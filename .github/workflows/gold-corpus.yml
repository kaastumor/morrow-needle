name: Gold Corpus contract

on:
  push:
    paths:
      - "fixtures/gold/**"
      - "schemas/gold-corpus-case-*.json"
      - "scripts/validate_gold_corpus.py"
      - "src/needle/gold.py"
      - "tests/test_gold_corpus_contract.py"
      - "tests/test_gold_output_matcher.py"
      - ".github/workflows/gold-corpus.yml"
  pull_request:
    paths:
      - "fixtures/gold/**"
      - "schemas/gold-corpus-case-*.json"
      - "scripts/validate_gold_corpus.py"
      - "src/needle/gold.py"
      - "tests/test_gold_corpus_contract.py"
      - "tests/test_gold_output_matcher.py"
      - ".github/workflows/gold-corpus.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install "jsonschema>=4.23,<5" "pytest>=8,<9"
      - name: Run Gold Corpus contract tests
        run: python -m pytest -q tests/test_gold_corpus_contract.py tests/test_gold_output_matcher.py
      - name: Validate all Gold Corpus fixtures
        run: python scripts/validate_gold_corpus.py
