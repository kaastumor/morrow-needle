<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Needle Corpus Explorer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Morrow // Needle</p>
      <h1>Needle Corpus Explorer</h1>
      <p>Inspect the adversarial EU legal-research corpus and follow its durable evidence owners.</p>
    </header>

    <section aria-labelledby="corpus-status-heading">
      <h2 id="corpus-status-heading">Corpus</h2>
      <p id="corpus-status" role="status" aria-live="polite">Loading canonical corpus…</p>
      <div id="corpus-root" hidden>
        <dl class="summary" aria-label="Corpus summary">
          <div><dt>Cases</dt><dd id="summary-total">—</dd></div>
          <div><dt>Trap classes</dt><dd id="summary-traps">—</dd></div>
          <div><dt>Derivation</dt><dd id="summary-derivation">—</dd></div>
          <div><dt>Evaluation</dt><dd id="summary-evaluation">—</dd></div>
          <div><dt>Surfaced-trap evaluations</dt><dd id="summary-surfaced">—</dd></div>
          <div><dt>Latent-trap evaluations</dt><dd id="summary-latent">—</dd></div>
          <div><dt>Evaluation mode unspecified</dt><dd id="summary-unspecified">—</dd></div>
        </dl>
      </div>
    </section>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
