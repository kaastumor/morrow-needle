name: Money corrigendum audit probe

on:
  push:
    paths:
      - "scripts/probe_reg2742_money_corrigendum.py"
      - "fixtures/audit/reg2742-money-corrigendum-source-v0.1.json"
      - "fixtures/mutations/reg2742-art4p1-eng-money-corrigendum-v0.1.json"
      - "fixtures/semantic/reg2742-art4p1-eng-money-atom-v0.1.json"
      - "tests/test_money_corrigendum_fixture.py"
      - "tests/test_money_corrigendum_semantics.py"
      - ".github/workflows/money-corrigendum-audit.yml"
  workflow_dispatch:

jobs:
  verify-pinned-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e ".[test]"
      - name: Verify pinned official corrigendum evidence and semantic scope
        run: |
          pytest -q \
            tests/test_money_corrigendum_fixture.py \
            tests/test_money_corrigendum_semantics.py

  inspect-live-source:
    # Live official endpoint availability is useful audit evidence, but it is not
    # pinned legal truth and must not make default-branch regression CI flaky.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e ".[test]"
      - name: Inspect official Cellar / EUR-Lex routes
        run: python scripts/probe_reg2742_money_corrigendum.py
      - uses: actions/upload-artifact@v4
        with:
          name: reg2742-money-corrigendum-inspection
          path: artifacts/audit/reg2742-money-corrigendum-inspection.json
