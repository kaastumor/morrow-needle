name: Gold Corpus contract

on:
  push:
    paths:
      - "fixtures/gold/**"
      - "fixtures/lineage/**"
      - "schemas/gold-corpus-case-*.json"
      - "scripts/validate_gold_corpus.py"
      - "src/needle/gold.py"
      - "tests/test_gold_corpus_contract.py"
      - "tests/test_gold_output_matcher.py"
      - "tests/test_gold_foundation_fixture.py"
      - "tests/test_gold_mutation_fixture.py"
      - "tests/test_gold_semantic_fixture.py"
      - ".github/workflows/gold-corpus.yml"
      - "pyproject.toml"
  pull_request:
    paths:
      - "fixtures/gold/**"
      - "fixtures/lineage/**"
      - "schemas/gold-corpus-case-*.json"
      - "scripts/validate_gold_corpus.py"
      - "src/needle/gold.py"
      - "tests/test_gold_corpus_contract.py"
      - "tests/test_gold_output_matcher.py"
      - "tests/test_gold_foundation_fixture.py"
      - "tests/test_gold_mutation_fixture.py"
      - "tests/test_gold_semantic_fixture.py"
      - ".github/workflows/gold-corpus.yml"
      - "pyproject.toml"
  workflow_dispatch:

concurrency:
  group: gold-corpus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run Gold Corpus contract tests
        run: python -m pytest -q tests/test_gold_corpus_contract.py tests/test_gold_output_matcher.py tests/test_gold_foundation_fixture.py tests/test_gold_mutation_fixture.py tests/test_gold_semantic_fixture.py
      - name: Validate all Gold Corpus fixtures
        run: python scripts/validate_gold_corpus.py
