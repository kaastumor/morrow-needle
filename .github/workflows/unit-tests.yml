name: Unit tests

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "schemas/**"
      - "corpus/**"
      - "mvp/**"
      - "docs/mvp/v0.1-release-check.md"
      - "pyproject.toml"
      - ".github/workflows/unit-tests.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "schemas/**"
      - "corpus/**"
      - "mvp/**"
      - "docs/mvp/v0.1-release-check.md"
      - "pyproject.toml"
      - ".github/workflows/unit-tests.yml"
  workflow_dispatch:

concurrency:
  group: unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run Python unit tests
        run: python -m pytest -q
      - name: Validate canonical adversarial corpus
        run: python scripts/validate_adversarial_corpus.py
      - name: Run browser projection unit tests
        run: node --test mvp/app.test.js
