[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "morrow-needle"
version = "0.0.1"
description = "Public infrastructure for observing how EU rules change"
requires-python = ">=3.12"
dependencies = [
  "requests>=2.32,<3",
]

[project.optional-dependencies]
test = [
  "jsonschema>=4.23,<5",
  "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
