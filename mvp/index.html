<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Needle Corpus Explorer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Morrow // Needle</p>
      <h1>Needle Corpus Explorer</h1>
      <p>Inspect the adversarial EU legal-research corpus and follow its durable evidence owners.</p>
    </header>

    <section aria-labelledby="corpus-status-heading">
      <h2 id="corpus-status-heading">Corpus</h2>
      <p id="corpus-status" role="status" aria-live="polite">Loading canonical corpus…</p>
      <div id="corpus-root" hidden></div>
    </section>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
