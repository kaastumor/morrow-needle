name: Cellar source regression + live probe

on:
  push:
    paths:
      - "scripts/probe_cellar.py"
      - "tests/test_cellar_representation_selection.py"
      - "schemas/manifestation-selection-v0.1.schema.json"
      - "schemas/source-observation-v0.1.schema.json"
      - ".github/workflows/cellar-probe.yml"
  workflow_dispatch:

concurrency:
  group: cellar-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run deterministic source-adapter regressions
        run: python -m pytest -q tests/test_cellar_representation_selection.py

  live-probe:
    # Network reachability and current Cellar representation drift are live
    # integration evidence. They must not determine ordinary branch-green.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Probe modern and historical CELEX works
        run: |
          python scripts/probe_cellar.py \
            32004R0794 \
            31958R0001 \
            02004R0794-20250813 \
            --out artifacts/cellar-probe.json
      - name: Upload raw probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cellar-source-probe
          path: artifacts/cellar-probe.json
          if-no-files-found: error
