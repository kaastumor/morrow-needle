name: Product audit-case hunter

on:
  push:
    paths:
      - "scripts/find_real_operational_audit_case.py"
      - ".github/workflows/product-audit-case-hunter.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Load latest operational state from main
        run: |
          git fetch origin main
          mkdir -p artifacts/product-audit-hunt
          git show origin/main:data/operational-pilot-state-v0.1.json > /tmp/needle-state.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e ".[test]"
      - name: Hunt a real audit/non-change case
        run: |
          python scripts/find_real_operational_audit_case.py \
            --state /tmp/needle-state.json \
            --hours 8 \
            --max-reobservations 20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-audit-case-hunt
          path: artifacts/product-audit-hunt/
          if-no-files-found: error
