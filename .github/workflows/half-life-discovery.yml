name: Half-Life discovery contract
# Passive historical/research workflow. Manual dispatch only under #290.

on:
  workflow_dispatch:


jobs:
  verify-pinned-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e ".[test]"
      - name: Regress pinned Half-Life evidence and ownership
        run: |
          python -m pytest -q \
            tests/test_half_life_discovery.py \
            tests/test_regime_lineage_v02.py

  inspect-live-source:
    # Endpoint availability/drift is observation evidence, not canonical truth.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e ".[test]"
      - name: Probe official Cellar sources
        run: python scripts/probe_half_life_eprivacy.py
      - uses: actions/upload-artifact@v4
        with:
          name: half-life-eprivacy-evidence
          path: artifacts/discovery/half-life-eprivacy-v0.1.json
