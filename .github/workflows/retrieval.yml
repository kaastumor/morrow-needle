name: Structured retrieval contract
# Passive historical/research workflow. Manual dispatch only under #290.

on:
  workflow_dispatch:


concurrency:
  group: structured-retrieval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run retrieval contract tests
        run: python -m pytest -q tests/test_retrieval.py
      - name: Build deterministic retrieval demo
        run: python scripts/build_article3_retrieval_demo.py
      - name: Upload retrieval demo
        uses: actions/upload-artifact@v4
        with:
          name: article3-retrieval-demo
          path: artifacts/retrieval
          if-no-files-found: error
