name: Live 2026/2104 mutation case

on:
  push:
    paths:
      - "scripts/probe_reg2104_live_case.py"
      - "scripts/build_reg2104_live_card.py"
      - "scripts/replay_reg2104_operational_path.py"
      - "src/needle/mutation/instructions.py"
      - "src/needle/operations/pipeline.py"
      - "src/needle/updates/temporal_metadata.py"
      - "src/needle/updates/reobserve.py"
      - "src/needle/operations/legal_analysis.py"
      - "src/needle/operations/authentic_candidates.py"
      - "schemas/mutation-candidate-v0.3.schema.json"
      - "schemas/source-change-v0.1.schema.json"
      - "schemas/operational-result-v0.1.schema.json"
      - "schemas/feed-card-v0.1.schema.json"
      - ".github/workflows/reg2104-live-case.yml"
  workflow_dispatch:

concurrency:
  group: reg2104-live-case-main
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e ".[test]"
      - name: Probe trigger, authentic cause and target checkpoints
        run: python scripts/probe_reg2104_live_case.py
      - name: Replay actual event through generic operational path
        run: python scripts/replay_reg2104_operational_path.py
      - name: Build and validate live CHANGE_FEED card
        shell: bash
        run: |
          set -o pipefail
          python scripts/build_reg2104_live_card.py 2>&1 | tee artifacts/reg2104-live-case/card-build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reg2104-live-case-evidence
          path: artifacts/reg2104-live-case/
          if-no-files-found: error
