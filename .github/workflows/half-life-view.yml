name: Half-Life derived view

on:
  push:
    paths:
      - "src/needle/analytics/**"
      - "schemas/half-life-*.schema.json"
      - "fixtures/analytics/**"
      - "fixtures/temporal/eprivacy-temporary-regime-v0.1.json"
      - "fixtures/lineage/reg2021-1232-to-reg2026-1881-gap-v0.2.json"
      - "tests/test_half_life_view.py"
      - "scripts/build_eprivacy_half_life_view.py"
      - ".github/workflows/half-life-view.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e ".[test]"
      - name: Test derived-view contract
        run: python -m pytest -q tests/test_half_life_view.py
      - name: Build ePrivacy Half-Life preview
        run: python scripts/build_eprivacy_half_life_view.py
      - uses: actions/upload-artifact@v4
        with:
          name: eprivacy-half-life-view
          path: artifacts/half-life/
